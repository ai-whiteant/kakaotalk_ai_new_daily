name: Kakao AI education news
on:
  schedule:
    # 22:00 UTC = following day 07:00 Asia/Seoul
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      send:
        description: 'Send to my Kakao chat (false saves preview only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kakao-daily-news
  cancel-in-progress: false

jobs:
  news:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_NEWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      KAKAO_LINK_URL: https://developers.kakao.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r news/requirements.txt
      - name: Restore encrypted refresh token and delivery record
        uses: actions/cache/restore@v4
        with:
          path: .state/kakao.enc
          key: kakao-state-${{ vars.KAKAO_STATE_VERSION || '1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kakao-state-${{ vars.KAKAO_STATE_VERSION || '1' }}-
      - name: Search, summarize and optionally send
        env:
          SEND_NEWS: ${{ github.event_name == 'schedule' || inputs.send }}
        run: |
          if [ "$SEND_NEWS" = "true" ]; then
            python -m news.daily --send
          else
            python -m news.daily
          fi
      - name: Persist encrypted state, including partial delivery status
        if: always() && hashFiles('.state/kakao.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/kakao.enc
          key: kakao-state-${{ vars.KAKAO_STATE_VERSION || '1' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save news preview (never credentials or raw source pages)
        if: always() && hashFiles('news-output/latest.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-education-news
          path: news-output/latest.md
          retention-days: 7

