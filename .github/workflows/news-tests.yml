name: News unit tests
on:
  push:
    paths: ['news/**', '.github/workflows/news-tests.yml', '.github/workflows/daily-news.yml']
  pull_request:
    paths: ['news/**', '.github/workflows/news-tests.yml', '.github/workflows/daily-news.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r news/requirements.txt
      - run: python -m unittest news.test_daily -v
